# CI de Nível 04 - Pipeline Integrada ao Build do Código

# nome da pipeline
name: "Execução Integrada"

# gatilhos / triggers - regras de disparo
# gatilho manual = workflow_dispatch

on:
  workflow_dispatch: 

# tarefas dentro da pipeline = jobs
jobs: 
    # nome do job
    inspecao:
              #máquina onde o job irá rodar / máquina ubuntu na versão mais recente
              runs-on: ubuntu-latest

              #passos do job
              steps:
                    # clone do projeto
                    - uses: actions/checkout@v4

                    # instalação do node
                    - uses: actions/setup-node@v4
                      with:
                        node-version: latest

                    # instalação do yarn
                    - name: Instalando o Yarn
                      run: npm install -g yarn

                    # instalação das dependências
                    - name: Instalando dependências
                      run: yarn

                    - name: Inspeção de código
                      run: yarn lint  

    unidade:  
              runs-on: ubuntu-latest
              needs: [ inspecao ]
              
              steps: 
                - uses: actions/checkout@v4

                - uses: actions/setup-node@v4
                  with:
                    node-version: latest

                - name: Instalando Yarn
                  run: npm install -g yarn

                - name: Instalando dependências  
                  run: yarn

                - name: Executando os testes unitários  
                  run: yarn run test:unit

    e2e-tests:
              runs-on: ubuntu-latest
              needs: [ inspecao ] # só executa se os jobs de inspe

              steps:
                - uses: actions/checkout@v4

                - uses: actions/setup-node@v4 
                  with:
                    node-version: latest

                - name: Instalando Yarn  
                  run: npm install -g yarn

                - name: Instalando dependências
                  run: yarn

                - name: Instalando os browsers do playwright
                  run: yarn playwright install

                - name: Executando os testes e2e
                  run: yarn run e2e


      deploy:
              runs-on: ubuntu-latest
              needs: [ unidade, e2e-tests ] # só executa se os jobs de teste unitário e e2e tiverem sido concluídos com sucesso
              

                    # instalação dps browsers do playwright
                    - name: Instalando os browsers do playwright
                      run: yarn playwright install

                    # executar os testes end twwo end - e2e
                    - name: Executando os testes e2e
                      run: yarn run e2e

                    # PLUGIN test reporter https://github.com/marketplace/actions/test-reporter
                    - name: Test Report
                      uses: dorny/test-reporter@v3
                      if: ${{ !cancelled() }}       # run this step even if previous step failed
                      with:
                        name: JEST Tests            # Name of the check run which will be created
                        path: results.xml    # Path to test results
                        #path: reports/jest-*.xml    # Path to test results
                        reporter: jest-junit        # Format of test results    