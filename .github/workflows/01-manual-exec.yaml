# CI de Nível 01 - Disparo Manualatravés de clique

# nome da pipeline
name: 'Execução Manual'

# gatilhos / triggers - regras de disparo
# gatilho manual = workflow_dispatch

on:
  workflow_dispatch: 

# tarefas dentro da pipeline = jobs
jobs: 
    # nome do job
    e2e-tests:
              #máquina onde o job irá rodar / máquina ubuntu na versão mais recente
              runs-on: ubuntu-latest

              #passos do job
              steps:
                    # clone do projeto
                    - uses: actions/checkout@v4

                    # instalação do node
                    - uses: actions/setup-node@v4
                      with:
                        node-version: 24.x

                    # instalação do yarn
                    - name: Instalando o Yarn
                      run: npm install -g yarn

                    # instalação das dependências
                    - name: Instalando dependências
                      run: yarn

                    # instalação dps browsers do playwright
                    - name: Instalando os browsers do playwright
                      run: yarn playwright install

                    # executar os testes end twwo end - e2e
                    - name: Executando os testes e2e
                      run: yarn run e2e    

                    # plugin lighthouse check
                      name: Lighthouse
                        on:[pull_request]

                      jobs:
                       lighthouse:
                        runs-on: ubuntu-latest
                        steps:
                        - uses: actions/checkout@master
                        - name: Lighthouse
                          uses: foo-software/lighthouse-check-action@master
                          with:
                            urls: 'https://www.foo.software,https://www.google.com'