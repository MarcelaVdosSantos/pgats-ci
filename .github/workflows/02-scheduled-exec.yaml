# CI de Nível 02 - Execução Agendada

# nome da pipeline
name: "Scheduled Execution"

# gatilhos / triggers - regras de disparo
# gatilho manual = workflow_dispatch

on:
  workflow_dispatch:
  schedule: 
    # cronograma de execução
    # 1 - minuto, 2 - hora, 3 dia dos Mês, 4 - mês, 5 - dia da semana
    - cron: '0 18 * * *'


# tarefas dentro da pipeline = jobs
jobs: 
    # nome do job
    e2e-tests:
              #máquina onde o job irá rodar / máquina ubuntu na versão mais recente
              runs-on: ubuntu-latest

              #passos do job
              steps:
                    # clone do projeto
                    - uses: actions/checkout@v4

                    # instalação do node
                    - uses: actions/setup-node@v4
                      with:
                        node-version: 20.x

                    # instalação do yarn
                    - name: Instalando o Yarn
                      run: npm install -g yarn

                    # instalação das dependências
                    - name: Instalando dependências
                      run: yarn

                    # instalação dps browsers do playwright
                    - name: Instalando os browsers do playwright
                      run: yarn playwright install --with-deps

                    # executar os testes end twwo end - e2e
                    - name: Executando os testes e2e
                      run: yarn run e2e

                    # PLUGIN test reporter https://github.com/marketplace/actions/test-reporter
                    - name: Test Report
                      uses: dorny/test-reporter@v3
                      if: ${{ !cancelled() }}       # run this step even if previous step failed
                      with:
                        name: E2E Tests            # Name of the check run which will be created
                        path: results.xml    # Path to test results
                        #path: reports/jest-*.xml    # Path to test results
                        reporter: jest-junit        # Format of test results    